# SamWiki skin on the Cayman remote theme.
# https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
#
# assets/css/style.scss sets the SamWiki color tokens, then imports
# jekyll-theme-cayman. The home page sets samwiki: true.
# Skin files come from sdcastillo/sdcastillo.github.io main:
#   assets/css/style.scss
#   _layouts/default.html
#   _includes/head-custom.html
#   _includes/samwiki-nav.html

title: Movie Keyword Vector Space
description: Cosine similarity and Euclidean distance on films and actors, read from IMDB plot keywords.
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
show_downloads: false
markdown: kramdown

# README.md stays the GitHub overview. The R Markdown deck opens with its own
# YAML front matter, so leave it out of the Pages build.
exclude:
  - README.md
  - S597A_Presentation.Rmd
  - vendor
